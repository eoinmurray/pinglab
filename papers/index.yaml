# Collection order controls the library navigation. Paper keys are relative PDF paths.
collections:
  default:
    label: Pinglab Paper Archive
    description: >-
      This library examines how circuits generate gamma and whether it contributes to brain computation, including criticism and competing explanations. It prioritises work that helps simulations distinguish gamma’s effects from firing rate, inhibition, connectivity, and shared input.
  generation-dynamics:
    label: Generation & Dynamics
    description: >-
      How circuits generate gamma: PING, ING, interneuron physiology, synaptic
      kinetics, heterogeneity, delays, and transitions between rhythmic and asynchronous states.
  proposed-functions:
    label: Proposed Functions
    description: >-
      Proposed roles for gamma in communication, routing, attention, sensory coding,
      inference, memory, learning, and plasticity.
  experimental-tests:
    label: Experimental Tests
    description: >-
      Recordings, perturbations, and behavioural studies that support or challenge
      gamma's proposed functions, including null results and failures to replicate.
  criticism-competing-explanations:
    label: Criticism & Competing Explanations
    description: >-
      Objections to functional theories, gamma as a by-product or correlate, limits
      of phase-based communication, and explanations based on rates, excitability, or common drive.
  modelling-measurement:
    label: Modelling & Measurement
    description: >-
      Spiking and population models, relationships between spikes and field signals,
      synchrony measures, analytical artefacts, and criticisms of model assumptions.
  biological-constraints:
    label: Biological Constraints
    description: >-
      Circuit architecture, realistic inputs, variability, behavioural timescales,
      and energetic costs that constrain proposed gamma mechanisms.

  history-of-gamma:
    label: History of Gamma
    description: >-
      Landmark discoveries and historical reviews tracing gamma research from
      early olfactory recordings to cortical synchrony, binding debates, inhibitory
      mechanisms, attention, and causal tests.

