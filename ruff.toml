# Ruff configuration for pinglab.
# Python includes Pingstore and experiment runners; the SNN library is external.

target-version = "py310"
line-length = 88

extend-exclude = [
    ".venv",
    # artifacts/ and temp/ are generated output, not source; .demolab/ is
    # engine staging the demolab CLI materialises (not ours to lint).
    ".demolab",
    "artifacts",
    "temp",
]

[lint]
# Correctness, consistent imports, modern syntax, and readable control flow.
select = ["E", "F", "I", "UP", "SIM", "C4", "RET", "B", "C901", "PIE"]
# Preserve scientific naming and the experiment configuration convention:
#   E501 (line too long) — code wrapping is `ruff format`'s job; the remaining
#         long lines are help-text strings and comment tables that don't wrap.
#   E741 (ambiguous name l/I/O) — `I` is inhibitory and `E` excitatory here;
#         the single-letter E/I vocabulary is deliberate, not ambiguous.
#   C408 (unnecessary dict call) — Experiment Rules require readable
#         dict(key=value, ...) blocks for resolved scientific defaults.
ignore = ["E501", "E741", "C408"]

[lint.mccabe]
max-complexity = 15

[lint.per-file-ignores]
# Experiment runners set sys.path before importing local modules (helpers +
# sibling runners live alongside them under experiments/), so module-level
# imports legitimately follow setup code.
"experiments/*" = ["E402"]

[format]
# Keep short signatures on one line; when they exceed line-length, Ruff puts
# each parameter on its own indented line. A trailing comma preserves that
# expanded layout even when the signature could fit on one line.
skip-magic-trailing-comma = false
quote-style = "double"
indent-style = "space"
