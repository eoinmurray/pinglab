<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">Decoder accessibility curve design schematic</title>
  <desc id="desc">Illustrative accuracy curves against logarithmic decoder parameter count. PING rises earlier than COBA and both converge at a shared ceiling. Values are not predictions.</desc>
  <style>.axis{stroke:#222;stroke-width:2;fill:none}.grid{stroke:#ddd;stroke-width:1}.ping{stroke:#a51d2d;stroke-width:4;fill:none}.coba{stroke:#222;stroke-width:3;fill:none}.native{stroke:#888;stroke-width:1.5;stroke-dasharray:7 6}.h{font:600 18px Arial,sans-serif;fill:#202020}.t{font:14px Arial,sans-serif;fill:#444}.s{font:13px Arial,sans-serif;fill:#666}.dotp{fill:#a51d2d}.dotc{fill:#222}</style>
  <rect width="1000" height="360" fill="white"/>
  <text x="500" y="28" text-anchor="middle" class="h">Design schematic — measured curves will replace these shapes</text>
  <path d="M100 285 H940 M100 285 V58" class="axis"/>
  <path d="M100 230 H940 M100 175 H940 M100 120 H940" class="grid"/>
  <path d="M100 82 H940" class="native"/><text x="932" y="74" text-anchor="end" class="s">native reference</text>
  <path d="M125 245 C220 220 278 164 360 120 S535 86 720 82 S850 82 920 82" class="ping"/>
  <path d="M125 266 C260 260 350 232 430 185 S570 105 700 87 S850 82 920 82" class="coba"/>
  <circle cx="125" cy="245" r="5" class="dotp"/><circle cx="360" cy="120" r="5" class="dotp"/><circle cx="720" cy="82" r="5" class="dotp"/>
  <circle cx="125" cy="266" r="5" class="dotc"/><circle cx="430" cy="185" r="5" class="dotc"/><circle cx="700" cy="87" r="5" class="dotc"/>
  <text x="748" y="107" class="t">PING</text><text x="590" y="152" class="t">COBA</text>
  <text x="520" y="338" text-anchor="middle" class="t">trainable decoder parameters P (log scale)</text>
  <text x="25" y="176" text-anchor="middle" transform="rotate(-90 25 176)" class="t">held-out MNIST accuracy</text>
  <text x="120" y="310" class="s">linear</text><text x="438" y="310" class="s">small recurrent</text><text x="785" y="310" class="s">large recurrent</text>
  <line x1="690" y1="322" x2="730" y2="322" class="ping"/><text x="738" y="327" class="s">PING</text><line x1="805" y1="322" x2="845" y2="322" class="coba"/><text x="853" y="327" class="s">COBA</text>
</svg>
