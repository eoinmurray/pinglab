<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Frozen representation access experiment</title>
  <desc id="desc">Identical MNIST spike inputs branch into frozen COBA and PING networks. Their matched binned excitatory spike representations feed separately trained decoder ladders and held-out decisions.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#333"/></marker>
    <style>.box{fill:#fff;stroke:#242424;stroke-width:2}.soft{fill:#f3f0e8;stroke:#777;stroke-width:1.5}.accent{fill:#fff4f3;stroke:#a51d2d;stroke-width:2}.line{fill:none;stroke:#333;stroke-width:2;marker-end:url(#arrow)}.dash{fill:none;stroke:#888;stroke-width:1.5;stroke-dasharray:6 5}.h{font:600 18px Arial,sans-serif;fill:#202020}.t{font:15px Arial,sans-serif;fill:#303030}.s{font:13px Arial,sans-serif;fill:#666}.red{stroke:#a51d2d;fill:none;stroke-width:2.5}.ink{stroke:#222;fill:none;stroke-width:2}</style>
  </defs>
  <rect width="1200" height="470" fill="white"/>
  <text x="600" y="34" text-anchor="middle" class="h">Freeze the representation; vary only how hard it is to read</text>
  <rect x="28" y="166" width="150" height="112" rx="8" class="soft"/>
  <text x="103" y="197" text-anchor="middle" class="h">MNIST image</text>
  <path d="M70 250 Q82 205 104 246 Q121 278 139 211 M67 251 H143" class="ink"/>
  <text x="103" y="300" text-anchor="middle" class="s">identical Poisson spikes</text>
  <path d="M178 222 H220 V113 H257" class="line"/><path d="M220 222 V350 H257" class="line"/>
  <rect x="257" y="64" width="190" height="100" rx="8" class="box"/>
  <text x="352" y="98" text-anchor="middle" class="h">Frozen COBA</text><text x="352" y="128" text-anchor="middle" class="t">weights never update</text>
  <rect x="257" y="300" width="190" height="100" rx="8" class="accent"/>
  <text x="352" y="334" text-anchor="middle" class="h">Frozen PING</text><text x="352" y="364" text-anchor="middle" class="t">weights never update</text>
  <path d="M447 113 H500" class="line"/><path d="M447 350 H500" class="line"/>
  <rect x="500" y="64" width="218" height="100" rx="8" class="soft"/>
  <text x="609" y="94" text-anchor="middle" class="h">Hidden E spikes</text><text x="609" y="122" text-anchor="middle" class="t">40 bins × 1,024 neurons</text><text x="609" y="147" text-anchor="middle" class="s">same interface</text>
  <rect x="500" y="300" width="218" height="100" rx="8" class="soft"/>
  <text x="609" y="330" text-anchor="middle" class="h">Hidden E spikes</text><text x="609" y="358" text-anchor="middle" class="t">40 bins × 1,024 neurons</text><text x="609" y="383" text-anchor="middle" class="s">same interface</text>
  <path d="M718 113 H770" class="line"/><path d="M718 350 H770" class="line"/>
  <rect x="770" y="64" width="238" height="100" rx="8" class="box"/>
  <text x="889" y="93" text-anchor="middle" class="h">COBA decoder ladder</text><text x="889" y="121" text-anchor="middle" class="t">linear → temporal → GRU</text><text x="889" y="147" text-anchor="middle" class="s">only decoder learns</text>
  <rect x="770" y="300" width="238" height="100" rx="8" class="accent"/>
  <text x="889" y="329" text-anchor="middle" class="h">PING decoder ladder</text><text x="889" y="357" text-anchor="middle" class="t">linear → temporal → GRU</text><text x="889" y="383" text-anchor="middle" class="s">matched capacity</text>
  <path d="M1008 113 H1050" class="line"/><path d="M1008 350 H1050" class="line"/>
  <rect x="1050" y="82" width="122" height="64" rx="8" class="box"/><text x="1111" y="108" text-anchor="middle" class="h">Decision</text><text x="1111" y="132" text-anchor="middle" class="s">held-out test</text>
  <rect x="1050" y="318" width="122" height="64" rx="8" class="box"/><text x="1111" y="344" text-anchor="middle" class="h">Decision</text><text x="1111" y="368" text-anchor="middle" class="s">held-out test</text>
  <path d="M500 230 H1008" class="dash"/><text x="754" y="219" text-anchor="middle" class="s">same trials · labels · optimization budget · decoder seeds</text>
</svg>
