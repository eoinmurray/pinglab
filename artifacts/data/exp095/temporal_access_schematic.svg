<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">Capacity by temporal access design schematic</title>
  <desc id="desc">Matched COBA and PING grids vary decoder capacity across columns and temporal context down rows. Darker cells illustrate higher accuracy without asserting expected values.</desc>
  <style>.frame{fill:none;stroke:#222;stroke-width:2}.cell{stroke:white;stroke-width:2}.l0{fill:#f1eee8}.l1{fill:#d8c8c6}.l2{fill:#c8999d}.l3{fill:#b75f6a}.l4{fill:#a51d2d}.h{font:600 18px Arial,sans-serif;fill:#202020}.t{font:14px Arial,sans-serif;fill:#444}.s{font:13px Arial,sans-serif;fill:#666}</style>
  <rect width="1000" height="430" fill="white"/>
  <text x="500" y="28" text-anchor="middle" class="h">Design schematic — capacity and temporal access vary independently</text>
  <text x="285" y="66" text-anchor="middle" class="h">COBA</text><text x="715" y="66" text-anchor="middle" class="h">PING</text>
  <g transform="translate(105 82)">
    <rect x="0" y="0" width="360" height="250" class="frame"/>
    <rect x="0" y="0" width="72" height="50" class="cell l0"/><rect x="72" y="0" width="72" height="50" class="cell l0"/><rect x="144" y="0" width="72" height="50" class="cell l1"/><rect x="216" y="0" width="72" height="50" class="cell l1"/><rect x="288" y="0" width="72" height="50" class="cell l2"/>
    <rect x="0" y="50" width="72" height="50" class="cell l0"/><rect x="72" y="50" width="72" height="50" class="cell l1"/><rect x="144" y="50" width="72" height="50" class="cell l1"/><rect x="216" y="50" width="72" height="50" class="cell l2"/><rect x="288" y="50" width="72" height="50" class="cell l2"/>
    <rect x="0" y="100" width="72" height="50" class="cell l0"/><rect x="72" y="100" width="72" height="50" class="cell l1"/><rect x="144" y="100" width="72" height="50" class="cell l2"/><rect x="216" y="100" width="72" height="50" class="cell l2"/><rect x="288" y="100" width="72" height="50" class="cell l3"/>
    <rect x="0" y="150" width="72" height="50" class="cell l1"/><rect x="72" y="150" width="72" height="50" class="cell l1"/><rect x="144" y="150" width="72" height="50" class="cell l2"/><rect x="216" y="150" width="72" height="50" class="cell l3"/><rect x="288" y="150" width="72" height="50" class="cell l4"/>
    <rect x="0" y="200" width="72" height="50" class="cell l1"/><rect x="72" y="200" width="72" height="50" class="cell l2"/><rect x="144" y="200" width="72" height="50" class="cell l3"/><rect x="216" y="200" width="72" height="50" class="cell l4"/><rect x="288" y="200" width="72" height="50" class="cell l4"/>
  </g>
  <g transform="translate(535 82)">
    <rect x="0" y="0" width="360" height="250" class="frame"/>
    <rect x="0" y="0" width="72" height="50" class="cell l0"/><rect x="72" y="0" width="72" height="50" class="cell l1"/><rect x="144" y="0" width="72" height="50" class="cell l1"/><rect x="216" y="0" width="72" height="50" class="cell l2"/><rect x="288" y="0" width="72" height="50" class="cell l2"/>
    <rect x="0" y="50" width="72" height="50" class="cell l1"/><rect x="72" y="50" width="72" height="50" class="cell l1"/><rect x="144" y="50" width="72" height="50" class="cell l2"/><rect x="216" y="50" width="72" height="50" class="cell l3"/><rect x="288" y="50" width="72" height="50" class="cell l3"/>
    <rect x="0" y="100" width="72" height="50" class="cell l1"/><rect x="72" y="100" width="72" height="50" class="cell l2"/><rect x="144" y="100" width="72" height="50" class="cell l3"/><rect x="216" y="100" width="72" height="50" class="cell l3"/><rect x="288" y="100" width="72" height="50" class="cell l4"/>
    <rect x="0" y="150" width="72" height="50" class="cell l2"/><rect x="72" y="150" width="72" height="50" class="cell l3"/><rect x="144" y="150" width="72" height="50" class="cell l3"/><rect x="216" y="150" width="72" height="50" class="cell l4"/><rect x="288" y="150" width="72" height="50" class="cell l4"/>
    <rect x="0" y="200" width="72" height="50" class="cell l3"/><rect x="72" y="200" width="72" height="50" class="cell l3"/><rect x="144" y="200" width="72" height="50" class="cell l4"/><rect x="216" y="200" width="72" height="50" class="cell l4"/><rect x="288" y="200" width="72" height="50" class="cell l4"/>
  </g>
  <text x="500" y="388" text-anchor="middle" class="t">decoder capacity →</text><text x="53" y="210" text-anchor="middle" transform="rotate(-90 53 210)" class="t">available activity duration →</text>
  <text x="105" y="354" class="s">linear</text><text x="398" y="354" class="s">large GRU</text><text x="535" y="354" class="s">linear</text><text x="828" y="354" class="s">large GRU</text>
  <rect x="390" y="405" width="38" height="12" class="l0"/><rect x="428" y="405" width="38" height="12" class="l1"/><rect x="466" y="405" width="38" height="12" class="l2"/><rect x="504" y="405" width="38" height="12" class="l3"/><rect x="542" y="405" width="38" height="12" class="l4"/><text x="375" y="416" text-anchor="end" class="s">lower</text><text x="594" y="416" class="s">higher accuracy</text>
</svg>
