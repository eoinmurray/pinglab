<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">Decoder sample efficiency design schematic</title>
  <desc id="desc">Three matched panels for linear, medium recurrent, and larger recurrent decoders compare illustrative COBA and PING accuracy against labelled training examples.</desc>
  <style>.axis{stroke:#222;stroke-width:1.8;fill:none}.grid{stroke:#ddd;stroke-width:1}.ping{stroke:#a51d2d;stroke-width:3;fill:none}.coba{stroke:#222;stroke-width:2.5;fill:none}.h{font:600 17px Arial,sans-serif;fill:#202020}.t{font:14px Arial,sans-serif;fill:#444}.s{font:13px Arial,sans-serif;fill:#666}</style>
  <rect width="1000" height="360" fill="white"/>
  <text x="500" y="27" text-anchor="middle" class="h">Design schematic — identical nested training subsets</text>
  <g transform="translate(70 62)"><text x="130" y="0" text-anchor="middle" class="h">Linear rate probe</text><path d="M0 235H260M0 235V25" class="axis"/><path d="M0 180H260M0 125H260M0 70H260" class="grid"/><path d="M10 210C65 200 120 187 175 169S225 150 250 141" class="ping"/><path d="M10 225C80 223 140 218 190 208S232 195 250 188" class="coba"/></g>
  <g transform="translate(370 62)"><text x="130" y="0" text-anchor="middle" class="h">GRU-16</text><path d="M0 235H260M0 235V25" class="axis"/><path d="M0 180H260M0 125H260M0 70H260" class="grid"/><path d="M10 195C65 165 110 129 165 105S220 86 250 80" class="ping"/><path d="M10 220C78 210 125 182 175 145S225 109 250 96" class="coba"/></g>
  <g transform="translate(670 62)"><text x="130" y="0" text-anchor="middle" class="h">GRU-64</text><path d="M0 235H260M0 235V25" class="axis"/><path d="M0 180H260M0 125H260M0 70H260" class="grid"/><path d="M10 184C65 142 112 105 165 84S220 75 250 72" class="ping"/><path d="M10 215C70 190 122 143 175 107S222 84 250 77" class="coba"/></g>
  <text x="500" y="337" text-anchor="middle" class="t">labelled decoder-training images (log scale)</text><text x="22" y="180" text-anchor="middle" transform="rotate(-90 22 180)" class="t">held-out MNIST accuracy</text>
  <line x1="715" y1="329" x2="755" y2="329" class="ping"/><text x="762" y="334" class="s">PING</text><line x1="825" y1="329" x2="865" y2="329" class="coba"/><text x="872" y="334" class="s">COBA</text>
</svg>
