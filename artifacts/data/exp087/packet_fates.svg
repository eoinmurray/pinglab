<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Three expected packet trajectories through the synfire chain</title>
  <desc id="desc">Three columns show a weak diffuse packet dying, a broad strong packet sharpening toward a stable packet, and a narrow oversized packet relaxing toward the same stable packet. Upper panels show packet rasters across six pools. Lower panels show packet size alpha and width sigma across pools.</desc>
  <rect width="1200" height="620" fill="#ffffff"/>
  <style>
    .title { font: 600 25px system-ui, sans-serif; fill: #171717; }
    .subtitle { font: 17px system-ui, sans-serif; fill: #555; }
    .head { font: 600 19px system-ui, sans-serif; fill: #171717; }
    .label { font: 15px system-ui, sans-serif; fill: #333; }
    .small { font: 14px system-ui, sans-serif; fill: #555; }
    .axis { stroke: #333; stroke-width: 1.5; fill: none; }
    .packet { stroke: #171717; stroke-width: 2.2; }
    .alpha { stroke: #171717; stroke-width: 3; fill: none; }
    .sigma { stroke: #c8102e; stroke-width: 3; fill: none; }
    .target { fill: #dcecf7; }
    .guide { stroke: #277da1; stroke-width: 1.3; stroke-dasharray: 5 4; }
  </style>

  <text x="55" y="42" class="title">Packets either die or approach the stable packet</text>
  <text x="55" y="70" class="subtitle">Design schematic: two different propagating packets should converge toward the same state</text>

  <text x="225" y="110" text-anchor="middle" class="head">Weak and diffuse</text>
  <text x="600" y="110" text-anchor="middle" class="head">Broad but strong</text>
  <text x="975" y="110" text-anchor="middle" class="head">Narrow and oversized</text>

  <!-- raster axes -->
  <path d="M75 140 V340 H375 M450 140 V340 H750 M825 140 V340 H1125" class="axis"/>
  <text x="38" y="240" transform="rotate(-90 38 240)" text-anchor="middle" class="label">pool</text>
  <text x="225" y="365" text-anchor="middle" class="label">time</text>
  <text x="600" y="365" text-anchor="middle" class="label">time</text>
  <text x="975" y="365" text-anchor="middle" class="label">time</text>

  <!-- dying raster -->
  <g class="packet">
    <line x1="120" y1="157" x2="120" y2="176"/><line x1="130" y1="157" x2="130" y2="176"/><line x1="144" y1="157" x2="144" y2="176"/>
    <line x1="153" y1="189" x2="153" y2="208"/><line x1="169" y1="189" x2="169" y2="208"/>
    <line x1="195" y1="221" x2="195" y2="240"/>
  </g>
  <text x="255" y="254" class="small">extinction</text>

  <!-- broad-to-stable raster -->
  <g class="packet">
    <line x1="488" y1="157" x2="488" y2="176"/><line x1="515" y1="157" x2="515" y2="176"/><line x1="540" y1="157" x2="540" y2="176"/><line x1="566" y1="157" x2="566" y2="176"/>
    <line x1="530" y1="189" x2="530" y2="208"/><line x1="549" y1="189" x2="549" y2="208"/><line x1="565" y1="189" x2="565" y2="208"/><line x1="581" y1="189" x2="581" y2="208"/>
    <line x1="570" y1="221" x2="570" y2="240"/><line x1="582" y1="221" x2="582" y2="240"/><line x1="593" y1="221" x2="593" y2="240"/><line x1="604" y1="221" x2="604" y2="240"/>
    <line x1="606" y1="253" x2="606" y2="272"/><line x1="617" y1="253" x2="617" y2="272"/><line x1="628" y1="253" x2="628" y2="272"/><line x1="639" y1="253" x2="639" y2="272"/>
    <line x1="642" y1="285" x2="642" y2="304"/><line x1="653" y1="285" x2="653" y2="304"/><line x1="664" y1="285" x2="664" y2="304"/><line x1="675" y1="285" x2="675" y2="304"/>
    <line x1="678" y1="317" x2="678" y2="336"/><line x1="689" y1="317" x2="689" y2="336"/><line x1="700" y1="317" x2="700" y2="336"/><line x1="711" y1="317" x2="711" y2="336"/>
  </g>

  <!-- narrow-to-stable raster -->
  <g class="packet">
    <line x1="862" y1="157" x2="862" y2="176"/><line x1="868" y1="157" x2="868" y2="176"/><line x1="874" y1="157" x2="874" y2="176"/><line x1="880" y1="157" x2="880" y2="176"/><line x1="886" y1="157" x2="886" y2="176"/><line x1="892" y1="157" x2="892" y2="176"/>
    <line x1="913" y1="189" x2="913" y2="208"/><line x1="921" y1="189" x2="921" y2="208"/><line x1="929" y1="189" x2="929" y2="208"/><line x1="937" y1="189" x2="937" y2="208"/><line x1="945" y1="189" x2="945" y2="208"/>
    <line x1="959" y1="221" x2="959" y2="240"/><line x1="969" y1="221" x2="969" y2="240"/><line x1="979" y1="221" x2="979" y2="240"/><line x1="989" y1="221" x2="989" y2="240"/>
    <line x1="1000" y1="253" x2="1000" y2="272"/><line x1="1011" y1="253" x2="1011" y2="272"/><line x1="1022" y1="253" x2="1022" y2="272"/><line x1="1033" y1="253" x2="1033" y2="272"/>
    <line x1="1037" y1="285" x2="1037" y2="304"/><line x1="1048" y1="285" x2="1048" y2="304"/><line x1="1059" y1="285" x2="1059" y2="304"/><line x1="1070" y1="285" x2="1070" y2="304"/>
    <line x1="1074" y1="317" x2="1074" y2="336"/><line x1="1085" y1="317" x2="1085" y2="336"/><line x1="1096" y1="317" x2="1096" y2="336"/><line x1="1107" y1="317" x2="1107" y2="336"/>
  </g>

  <!-- metric axes -->
  <path d="M75 415 V565 H375 M450 415 V565 H750 M825 415 V565 H1125" class="axis"/>
  <text x="38" y="490" transform="rotate(-90 38 490)" text-anchor="middle" class="label">packet measure</text>
  <text x="225" y="595" text-anchor="middle" class="label">pool 1 → pool 6</text>
  <text x="600" y="595" text-anchor="middle" class="label">pool 1 → pool 6</text>
  <text x="975" y="595" text-anchor="middle" class="label">pool 1 → pool 6</text>

  <rect x="450" y="472" width="300" height="28" class="target"/><rect x="825" y="472" width="300" height="28" class="target"/>
  <path d="M92 447 L145 470 L198 505 L251 540" class="alpha"/><path d="M92 485 L145 510 L198 538 L251 552" class="sigma"/>
  <path d="M467 438 L520 452 L573 468 L626 482 L679 486 L732 486" class="alpha"/><path d="M467 430 L520 448 L573 466 L626 484 L679 488 L732 488" class="sigma"/>
  <path d="M842 430 L895 450 L948 468 L1001 482 L1054 487 L1107 487" class="alpha"/><path d="M842 538 L895 520 L948 501 L1001 489 L1054 487 L1107 487" class="sigma"/>
  <line x1="285" y1="438" x2="315" y2="438" class="alpha"/><text x="323" y="444" class="small">α</text>
  <line x1="285" y1="468" x2="315" y2="468" class="sigma"/><text x="323" y="474" class="small">σ</text>
  <text x="600" y="404" text-anchor="middle" fill="#277da1" class="small">stable packet region</text>
  <text x="975" y="404" text-anchor="middle" fill="#277da1" class="small">same stable packet region</text>
</svg>
