  <g class="small" text-anchor="end">
    <text x="55" y="128">P1</text><text x="55" y="186">P2</text><text x="55" y="244">P3</text>
    <text x="55" y="302">P4</text><text x="55" y="360">P5</text><text x="55" y="418">P6</text>
