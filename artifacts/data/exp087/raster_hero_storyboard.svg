<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc">
  <title id="title">Design frame for a classic scrolling synfire raster</title>
  <desc id="desc">A white scientific spike raster with six pool bands, black background spikes, a cyan packet volley, and a red dashed packet-input marker.</desc>
  <rect width="1200" height="550" fill="#ffffff"/>
  <style>
    .title { font: 600 24px system-ui, sans-serif; fill: #1f2328; }
    .label { font: 17px system-ui, sans-serif; fill: #1f2328; }
    .small { font: 15px system-ui, sans-serif; fill: #57606a; }
    .axis { stroke: #1f2328; stroke-width: 2; }
    .rule { stroke: #d8dee4; stroke-width: 1; }
    .background { stroke: #1f2328; stroke-width: 1.7; stroke-linecap: round; opacity: 0.65; }
    .packet { stroke: #00a6c8; stroke-width: 2.4; stroke-linecap: round; }
    .input { stroke: #c91832; stroke-width: 1.7; stroke-dasharray: 7 6; }
  </style>

  <text x="100" y="40" class="title">Measured broad-packet run</text>
  <text x="1100" y="40" text-anchor="end" class="small">run time 52.0–92.0 ms</text>
  <line x1="100" y1="70" x2="100" y2="460" class="axis"/>
  <line x1="100" y1="460" x2="1140" y2="460" class="axis"/>
  <g class="rule">
    <line x1="100" y1="135" x2="1140" y2="135"/><line x1="100" y1="200" x2="1140" y2="200"/>
    <line x1="100" y1="265" x2="1140" y2="265"/><line x1="100" y1="330" x2="1140" y2="330"/>
    <line x1="100" y1="395" x2="1140" y2="395"/>
  </g>
  <g class="label" text-anchor="end">
    <text x="84" y="108">P1</text><text x="84" y="173">P2</text><text x="84" y="238">P3</text>
    <text x="84" y="303">P4</text><text x="84" y="368">P5</text><text x="84" y="433">P6</text>
  </g>

  <g class="background">
    <path d="M138 83v7 M176 118v7 M219 94v7 M262 124v7 M314 76v7 M367 109v7 M421 88v7 M497 121v7 M552 101v7 M935 84v7 M1012 116v7 M1091 91v7"/>
    <path d="M121 158v7 M190 187v7 M248 149v7 M339 176v7 M402 164v7 M471 191v7 M530 144v7 M909 181v7 M984 151v7 M1072 174v7"/>
    <path d="M151 224v7 M228 247v7 M293 211v7 M375 252v7 M448 232v7 M525 205v7 M940 242v7 M1037 219v7 M1110 250v7"/>
    <path d="M132 286v7 M207 316v7 M281 276v7 M356 307v7 M430 294v7 M511 271v7 M927 312v7 M1004 280v7 M1090 301v7"/>
    <path d="M159 348v7 M236 382v7 M304 341v7 M389 370v7 M467 354v7 M535 386v7 M947 344v7 M1021 378v7 M1115 360v7"/>
    <path d="M126 419v7 M198 447v7 M272 407v7 M350 438v7 M438 414v7 M522 451v7 M921 431v7 M997 405v7 M1084 444v7"/>
  </g>

  <line x1="620" y1="70" x2="620" y2="460" class="input"/>
  <g class="packet">
    <path d="M631 78v8 M640 112v8 M648 91v8 M657 123v8 M666 101v8 M675 73v8 M684 116v8"/>
    <path d="M671 145v8 M680 184v8 M689 161v8 M698 192v8 M707 151v8 M716 176v8 M725 168v8"/>
    <path d="M711 210v8 M720 246v8 M729 225v8 M738 255v8 M747 215v8 M756 239v8 M765 231v8"/>
    <path d="M751 276v8 M760 312v8 M769 289v8 M778 321v8 M787 280v8 M796 305v8 M805 297v8"/>
    <path d="M791 341v8 M800 379v8 M809 356v8 M818 386v8 M827 346v8 M836 371v8 M845 363v8"/>
    <path d="M831 405v8 M840 444v8 M849 421v8 M858 452v8 M867 411v8 M876 436v8 M885 428v8"/>
  </g>

  <g class="small" text-anchor="middle">
    <text x="100" y="486">0</text><text x="360" y="486">10</text><text x="620" y="486">20</text>
    <text x="880" y="486">30</text><text x="1140" y="486">40</text>
    <text x="620" y="520" class="label">time from window start (ms)</text>
  </g>
  <text x="24" y="270" text-anchor="middle" transform="rotate(-90 24 270)" class="label">pool and neuron index</text>
  <g transform="translate(720,515)" class="small">
    <path d="M0 -5v10" class="background"/><text x="12" y="5">background spike</text>
    <path d="M150 -5v10" class="packet"/><text x="162" y="5">packet volley</text>
    <line x1="275" y1="0" x2="300" y2="0" class="input"/><text x="310" y="5">packet input</text>
  </g>
</svg>
