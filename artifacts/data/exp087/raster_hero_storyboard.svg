<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc">
  <title id="title">Design frame for three synchronized scrolling spike rasters</title>
  <desc id="desc">Weak, broad, and oversized packet conditions appear in three aligned pool rasters with a shared moving time window.</desc>
  <rect width="1200" height="550" fill="#ffffff"/>
  <style>
    .title { font: 600 22px system-ui, sans-serif; fill: #1f2328; }
    .label { font: 17px system-ui, sans-serif; fill: #1f2328; }
    .small { font: 14px system-ui, sans-serif; fill: #57606a; }
    .axis { stroke: #1f2328; stroke-width: 2; }
    .rule { stroke: #d8dee4; stroke-width: 1; }
    .weak { stroke: #1f2328; stroke-width: 1.7; }
    .broad { stroke: #c91832; stroke-width: 1.8; }
    .large { stroke: #00a6c8; stroke-width: 1.8; }
  </style>

  <text x="600" y="34" text-anchor="middle" class="title">Measured packet trajectories rolling through time · 55–85 ms</text>

  <g transform="translate(65,0)">
    <text x="155" y="72" text-anchor="middle" class="label">Weak, diffuse</text>
    <path d="M0 95V445H310" fill="none" class="axis"/>
    <g class="rule"><path d="M0 153H310M0 211H310M0 269H310M0 327H310M0 385H310"/></g>
    <g class="weak">
      <path d="M20 112v7M62 137v7M91 103v7M129 145v7M181 119v7M226 132v7M278 108v7"/>
      <path d="M35 174v7M77 195v7M142 164v7M205 201v7M264 183v7"/>
      <path d="M28 230v7M103 251v7M173 221v7M244 246v7M292 228v7"/>
      <path d="M49 284v7M116 310v7M196 279v7M273 301v7"/>
      <path d="M22 346v7M88 373v7M160 338v7M238 367v7M288 349v7"/>
      <path d="M41 401v7M121 430v7M207 394v7M274 421v7"/>
    </g>
  </g>

  <g transform="translate(445,0)">
    <text x="155" y="72" text-anchor="middle" class="label">Broad, strong</text>
    <path d="M0 95V445H310" fill="none" class="axis"/>
    <g class="rule"><path d="M0 153H310M0 211H310M0 269H310M0 327H310M0 385H310"/></g>
    <g class="broad">
      <path d="M80 105v7M91 138v7M102 117v7M112 146v7M123 99v7M134 128v7M146 110v7"/>
      <path d="M113 164v7M124 201v7M135 177v7M146 206v7M157 169v7M168 191v7"/>
      <path d="M145 221v7M156 260v7M167 236v7M178 264v7M189 226v7M200 249v7"/>
      <path d="M177 279v7M188 319v7M199 294v7M210 323v7M221 284v7M232 307v7"/>
      <path d="M209 338v7M220 378v7M231 352v7M242 382v7M253 343v7M264 366v7"/>
      <path d="M241 395v7M252 437v7M263 410v7M274 440v7M285 401v7M296 425v7"/>
    </g>
  </g>

  <g transform="translate(825,0)">
    <text x="155" y="72" text-anchor="middle" class="label">Narrow, oversized</text>
    <path d="M0 95V445H310" fill="none" class="axis"/>
    <g class="rule"><path d="M0 153H310M0 211H310M0 269H310M0 327H310M0 385H310"/></g>
    <g class="large">
      <path d="M92 99v7M97 143v7M102 115v7M107 148v7M112 104v7M117 133v7M122 122v7"/>
      <path d="M123 160v7M129 205v7M135 176v7M141 209v7M147 166v7M153 195v7"/>
      <path d="M154 219v7M161 263v7M168 235v7M175 267v7M182 224v7M189 253v7"/>
