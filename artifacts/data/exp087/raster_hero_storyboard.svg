      <path d="M216 335v7M225 379v7M234 350v7M243 383v7M252 340v7M261 369v7"/>
      <path d="M247 393v7M256 438v7M265 408v7M274 442v7M283 398v7M292 428v7"/>
    </g>
  </g>

  <g class="small" text-anchor="middle">
    <text x="65" y="470">55</text><text x="220" y="470">70</text><text x="375" y="470">85</text>
    <text x="445" y="470">55</text><text x="600" y="470">70</text><text x="755" y="470">85</text>
    <text x="825" y="470">55</text><text x="980" y="470">70</text><text x="1135" y="470">85</text>
