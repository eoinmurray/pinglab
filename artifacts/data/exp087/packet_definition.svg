<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">A pulse packet has a spike count and temporal width</title>
  <desc id="desc">The left panel defines packet size alpha and temporal spread sigma using a spike raster. The middle and right panels compare narrow and broad packets with the same spike count. The narrow packet produces a larger coincident conductance peak and crosses threshold, while the broad packet does not.</desc>
  <rect width="1200" height="540" fill="#ffffff"/>
  <style>
    .title { font: 600 25px system-ui, sans-serif; fill: #171717; }
    .subtitle { font: 17px system-ui, sans-serif; fill: #555; }
    .head { font: 600 20px system-ui, sans-serif; fill: #171717; }
    .label { font: 16px system-ui, sans-serif; fill: #333; }
    .small { font: 15px system-ui, sans-serif; fill: #555; }
    .axis { stroke: #333; stroke-width: 1.5; fill: none; }
    .spike { stroke: #171717; stroke-width: 2.2; }
    .drive { stroke: #171717; stroke-width: 3; fill: none; stroke-linecap: round; }
    .broad { stroke: #c8102e; stroke-width: 3; fill: none; stroke-linecap: round; }
    .threshold { stroke: #6a6a6a; stroke-width: 1.4; stroke-dasharray: 6 5; }
    .accent { fill: #dcecf7; }
    .bracket { stroke: #277da1; stroke-width: 2; fill: none; }
  </style>

  <text x="55" y="42" class="title">A pulse packet has a size and a temporal width</text>
  <text x="55" y="70" class="subtitle">Design schematic: α counts spikes; σ measures their spread around the packet centre</text>

  <text x="220" y="112" text-anchor="middle" class="head">A  Packet description</text>
  <path d="M70 150 V410 H390" class="axis"/>
  <text x="35" y="280" transform="rotate(-90 35 280)" text-anchor="middle" class="label">input channel</text>
  <text x="230" y="470" text-anchor="middle" class="label">time</text>
  <rect x="202" y="150" width="76" height="260" rx="3" class="accent"/>
  <line x1="238" y1="150" x2="238" y2="410" stroke="#277da1" stroke-width="1.4" stroke-dasharray="5 5"/>
  <g class="spike">
    <line x1="209" y1="174" x2="209" y2="188"/><line x1="226" y1="195" x2="226" y2="209"/>
    <line x1="244" y1="216" x2="244" y2="230"/><line x1="252" y1="237" x2="252" y2="251"/>
    <line x1="231" y1="258" x2="231" y2="272"/><line x1="265" y1="279" x2="265" y2="293"/>
    <line x1="217" y1="300" x2="217" y2="314"/><line x1="241" y1="321" x2="241" y2="335"/>
    <line x1="256" y1="342" x2="256" y2="356"/><line x1="234" y1="363" x2="234" y2="377"/>
  </g>
  <path d="M202 397 V415 M202 406 H278 M278 397 V415" class="bracket"/>
  <text x="240" y="432" text-anchor="middle" fill="#277da1" class="small">spread σ</text>
  <text x="292" y="189" class="label">α = total spikes</text>
  <text x="292" y="215" class="small">one spike can come from each channel</text>

  <text x="605" y="112" text-anchor="middle" class="head">B  Narrow packet</text>
  <path d="M455 150 V410 H755" class="axis"/>
  <line x1="478" y1="181" x2="478" y2="198" class="spike"/><line x1="488" y1="181" x2="488" y2="198" class="spike"/>
  <line x1="495" y1="181" x2="495" y2="198" class="spike"/><line x1="503" y1="181" x2="503" y2="198" class="spike"/>
  <line x1="510" y1="181" x2="510" y2="198" class="spike"/><line x1="518" y1="181" x2="518" y2="198" class="spike"/>
  <line x1="526" y1="181" x2="526" y2="198" class="spike"/><line x1="534" y1="181" x2="534" y2="198" class="spike"/>
  <path d="M470 374 C492 372 506 362 520 330 C534 289 548 229 570 210 C591 230 604 288 619 330 C633 362 652 373 738 374" class="drive"/>
  <line x1="455" y1="272" x2="755" y2="272" class="threshold"/>
  <text x="745" y="263" text-anchor="end" class="small">firing threshold</text>
  <circle cx="570" cy="210" r="6" fill="#277da1"/>
  <text x="605" y="448" text-anchor="middle" class="label">coincident input sums strongly</text>
  <text x="605" y="478" text-anchor="middle" class="small">the pool emits a new packet</text>

  <text x="985" y="112" text-anchor="middle" class="head">C  Broad packet</text>
  <path d="M835 150 V410 H1135" class="axis"/>
  <line x1="855" y1="181" x2="855" y2="198" class="spike"/><line x1="884" y1="181" x2="884" y2="198" class="spike"/>
  <line x1="914" y1="181" x2="914" y2="198" class="spike"/><line x1="941" y1="181" x2="941" y2="198" class="spike"/>
  <line x1="970" y1="181" x2="970" y2="198" class="spike"/><line x1="1001" y1="181" x2="1001" y2="198" class="spike"/>
  <line x1="1032" y1="181" x2="1032" y2="198" class="spike"/><line x1="1065" y1="181" x2="1065" y2="198" class="spike"/>
  <path d="M850 374 C877 370 898 346 922 329 C944 313 965 299 987 299 C1010 299 1033 315 1055 331 C1078 349 1098 370 1118 374" class="broad"/>
  <line x1="835" y1="272" x2="1135" y2="272" class="threshold"/>
  <text x="1125" y="263" text-anchor="end" class="small">firing threshold</text>
  <text x="985" y="448" text-anchor="middle" class="label">the same spikes sum weakly</text>
  <text x="985" y="478" text-anchor="middle" class="small">the packet may fade or disappear</text>
</svg>
