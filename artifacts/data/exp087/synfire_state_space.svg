<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">Expected synfire packet state space</title>
  <desc id="desc">Packet size alpha is on the horizontal axis and temporal spread sigma on the vertical axis. A curved separatrix divides an upper-left extinction basin from a lower-right propagation basin. Trajectories in the propagation basin converge to one stable fixed point, while trajectories in the extinction basin move toward packet loss.</desc>
  <rect width="1200" height="610" fill="#ffffff"/>
  <style>
    .title { font: 600 25px system-ui, sans-serif; fill: #171717; }
    .subtitle { font: 17px system-ui, sans-serif; fill: #555; }
    .head { font: 600 20px system-ui, sans-serif; fill: #171717; }
    .label { font: 17px system-ui, sans-serif; fill: #333; }
    .small { font: 15px system-ui, sans-serif; fill: #555; }
    .axis { stroke: #333; stroke-width: 1.7; fill: none; }
    .separatrix { stroke: #c8102e; stroke-width: 3; stroke-dasharray: 9 7; fill: none; }
    .trajectory { stroke: #171717; stroke-width: 2.7; fill: none; marker-end: url(#arrow); }
    .extinct { stroke: #6a6a6a; stroke-width: 2.4; fill: none; marker-end: url(#arrow-grey); }
    .propagation { fill: #dcecf7; }
    .extinction { fill: #f1f1ef; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#171717"/></marker>
    <marker id="arrow-grey" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#6a6a6a"/></marker>
  </defs>

  <text x="55" y="42" class="title">The chain should contain an extinction boundary and a packet attractor</text>
  <text x="55" y="70" class="subtitle">Design schematic: arrows show the layer-to-layer transformation of packet state</text>

  <path d="M110 120 H1100 V530 H110 Z" class="extinction"/>
  <path d="M110 530 L1100 530 L1100 120 L770 120 C730 175 688 214 630 247 C554 291 466 315 360 329 C278 340 194 345 110 345 Z" class="propagation"/>
  <path d="M110 345 C194 345 278 340 360 329 C466 315 554 291 630 247 C688 214 730 175 770 120" class="separatrix"/>
  <path d="M110 120 V530 H1100" class="axis"/>
  <text x="605" y="575" text-anchor="middle" class="label">packet size α</text>
  <text x="50" y="325" transform="rotate(-90 50 325)" text-anchor="middle" class="label">temporal spread σ</text>

  <text x="410" y="175" text-anchor="middle" class="head">extinction basin</text>
  <text x="835" y="470" text-anchor="middle" class="head">propagation basin</text>
  <text x="505" y="272" transform="rotate(-20 505 272)" class="small" fill="#c8102e">separatrix</text>

  <!-- propagating trajectories -->
  <path d="M930 405 C850 390 785 374 730 355" class="trajectory"/>
  <path d="M900 255 C840 282 787 319 730 355" class="trajectory"/>
  <path d="M470 445 C555 420 642 389 730 355" class="trajectory"/>
  <path d="M615 500 C650 450 690 399 730 355" class="trajectory"/>
  <circle cx="730" cy="355" r="11" fill="#277da1" stroke="#171717" stroke-width="2"/>
  <text x="765" y="390" class="label">stable packet</text>
  <text x="765" y="414" class="small">fixed point</text>

  <!-- extinction trajectories -->
  <path d="M530 185 C450 198 370 224 285 270" class="extinct"/>
  <path d="M340 260 C278 280 220 307 165 338" class="extinct"/>
  <circle cx="135" cy="355" r="8" fill="#6a6a6a"/>
  <text x="145" y="386" class="small">packet disappears</text>

  <text x="605" y="602" text-anchor="middle" class="small">Result 3 will replace this schematic with measured layer-to-layer vectors.</text>
</svg>
