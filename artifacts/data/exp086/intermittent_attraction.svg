<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">How intermittent relative-phase attraction is detected</title>
  <desc id="desc">A four-panel design schematic. Relative phase continues to wrap through phase slips, relative-phase velocity repeatedly slows near a preferred position, the position-binned velocity has a minimum there, and the phase-position distribution has a corresponding peak.</desc>
  <rect width="1200" height="650" fill="#ffffff"/>
  <style>
    .title { font: 600 25px system-ui, sans-serif; fill: #171717; }
    .subtitle { font: 17px system-ui, sans-serif; fill: #555; }
    .head { font: 600 19px system-ui, sans-serif; fill: #171717; }
    .label { font: 15px system-ui, sans-serif; fill: #333; }
    .small { font: 14px system-ui, sans-serif; fill: #555; }
    .axis { stroke: #333; stroke-width: 1.5; fill: none; }
    .guide { stroke: #277da1; stroke-width: 1.5; stroke-dasharray: 5 5; fill: none; }
    .phase { stroke: #171717; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .velocity { stroke: #c51632; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .density { stroke: #277da1; stroke-width: 3; fill: #dcecf7; stroke-linecap: round; stroke-linejoin: round; }
    .band { fill: #dcecf7; }
  </style>

  <text x="60" y="42" class="title">How intermittent relative-phase attraction appears</text>
  <text x="60" y="70" class="subtitle">Design schematic — Result 3 will reproduce these panels from measured data</text>

  <!-- Panel A -->
  <text x="325" y="112" text-anchor="middle" class="head">A  Relative-phase position through time</text>
  <rect x="95" y="184" width="460" height="28" rx="3" class="band"/>
  <path d="M95 135 V295 H555" class="axis"/>
  <text x="58" y="215" transform="rotate(-90 58 215)" text-anchor="middle" class="label">position θ</text>
  <text x="325" y="324" text-anchor="middle" class="label">time</text>
  <text x="84" y="145" text-anchor="end" class="small">+π</text>
  <text x="84" y="294" text-anchor="end" class="small">−π</text>
  <path d="M105 286 L142 245 C157 225 172 209 193 202 C222 193 246 196 270 190 C291 185 309 170 332 137 M332 137 L332 287 M332 287 L369 246 C384 226 399 210 420 202 C449 193 473 196 497 190 C518 184 536 166 548 143" class="phase"/>
  <text x="205" y="173" text-anchor="middle" class="small">longer dwell</text>
  <text x="438" y="173" text-anchor="middle" class="small">longer dwell</text>

  <!-- Panel B -->
  <text x="895" y="112" text-anchor="middle" class="head">B  Relative-phase velocity through time</text>
  <path d="M665 135 V295 H1125" class="axis"/>
  <text x="628" y="215" transform="rotate(-90 628 215)" text-anchor="middle" class="label">velocity vθ</text>
  <text x="895" y="324" text-anchor="middle" class="label">time</text>
  <path d="M675 161 C715 164 745 180 770 226 C783 251 800 255 817 230 C840 194 865 169 902 161 C942 164 972 180 997 226 C1010 251 1027 255 1044 230 C1067 194 1092 169 1115 163" class="velocity"/>
  <path d="M785 135 V295 M1012 135 V295" class="guide"/>
  <text x="785" y="280" text-anchor="middle" class="small">slow</text>
  <text x="1012" y="280" text-anchor="middle" class="small">slow</text>

  <!-- Panel C -->
  <text x="325" y="390" text-anchor="middle" class="head">C  Velocity depends on phase position</text>
  <path d="M95 415 V570 H555" class="axis"/>
  <text x="58" y="493" transform="rotate(-90 58 493)" text-anchor="middle" class="label">mean velocity vθ</text>
  <text x="325" y="605" text-anchor="middle" class="label">relative-phase position θ</text>
  <text x="98" y="591" class="small">−π</text>
  <text x="550" y="591" text-anchor="end" class="small">+π</text>
  <rect x="286" y="415" width="58" height="155" class="band"/>
  <path d="M105 441 C155 445 205 461 255 500 C281 522 302 535 321 532 C350 526 377 492 410 466 C455 433 505 435 545 439" class="velocity"/>
  <path d="M315 415 V570" class="guide"/>
  <text x="315" y="556" text-anchor="middle" class="small">minimum</text>

  <!-- Panel D -->
  <text x="895" y="390" text-anchor="middle" class="head">D  Slowing produces a preferred position</text>
  <path d="M665 415 V570 H1125" class="axis"/>
  <text x="628" y="493" transform="rotate(-90 628 493)" text-anchor="middle" class="label">time spent / density</text>
  <text x="895" y="605" text-anchor="middle" class="label">relative-phase position θ</text>
  <text x="668" y="591" class="small">−π</text>
  <text x="1120" y="591" text-anchor="end" class="small">+π</text>
  <rect x="856" y="415" width="58" height="155" class="band"/>
  <path d="M675 558 C735 555 790 548 832 520 C854 504 866 462 885 441 C904 462 916 504 938 520 C980 548 1035 555 1115 558 L1115 570 L675 570 Z" class="density"/>
  <path d="M885 415 V570" class="guide"/>
  <text x="885" y="438" text-anchor="middle" class="small">peak</text>

  <text x="600" y="636" text-anchor="middle" class="small">The velocity minimum and density peak should occur at the same relative-phase position.</text>
</svg>
