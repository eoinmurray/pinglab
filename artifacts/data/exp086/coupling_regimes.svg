<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="648" viewBox="0 0 1200 648" role="img" aria-labelledby="title desc">
  <title id="title">Expected transition as reciprocal coupling weakens</title>
  <desc id="desc">A qualitative two-by-three schematic matching the measured coupling-regime figure. Columns show strong, intermediate, and zero coupling. Rows show relative-phase position through time and mean relative-phase velocity by position.</desc>
  <rect width="1200" height="648" fill="#ffffff"/>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1a1a1a; }
    .title { font-size: 21px; font-weight: 700; }
    .note { font-size: 13px; fill: #555; }
    .head { font-size: 16px; font-weight: 700; }
    .label { font-size: 14px; }
    .tick { font-size: 12px; }
    .axis { stroke: #1a1a1a; stroke-width: 1.6; fill: none; }
    .zero { stroke: #a0a0a0; stroke-width: 1; stroke-dasharray: 5 4; }
    .strong { stroke: #1a1a1a; fill: none; stroke-width: 2.5; }
    .intermediate { stroke: #c8102e; fill: none; stroke-width: 2.5; }
    .uncoupled { stroke: #6a6a6a; fill: none; stroke-width: 2.5; }
    .strong-dot { fill: #1a1a1a; }
    .intermediate-dot { fill: #c8102e; }
    .uncoupled-dot { fill: #6a6a6a; }
    .band { fill: #00b4d8; fill-opacity: 0.12; }
  </style>

  <text x="600" y="34" text-anchor="middle" class="title">Expected transition as reciprocal coupling weakens</text>
  <text x="1140" y="34" text-anchor="end" class="note">qualitative schematic</text>

  <g id="titles" text-anchor="middle">
    <text x="225" y="78" class="head">Strong coupling</text>
    <text x="225" y="99" class="note">K high</text>
    <text x="600" y="78" class="head">Intermediate coupling</text>
    <text x="600" y="99" class="note">K intermediate</text>
    <text x="975" y="78" class="head">No coupling</text>
    <text x="975" y="99" class="note">K = 0</text>
  </g>

  <!-- Preferred-position bands and top-row axes. -->
  <rect x="78" y="179" width="294" height="24" class="band"/>
  <rect x="453" y="179" width="294" height="24" class="band"/>
  <rect x="828" y="179" width="294" height="24" class="band"/>
  <path d="M78 120V300H372 M453 120V300H747 M828 120V300H1122" class="axis"/>
  <text x="32" y="210" transform="rotate(-90 32 210)" text-anchor="middle" class="label">relative-phase position (rad)</text>
  <g class="tick" text-anchor="end"><text x="68" y="129">π</text><text x="68" y="215">0</text><text x="68" y="300">−π</text></g>
  <g class="label" text-anchor="middle">
    <text x="225" y="330">time in displayed window (ms)</text>
    <text x="600" y="330">time in displayed window (ms)</text>
    <text x="975" y="330">time in displayed window (ms)</text>
  </g>

  <!-- Idealized relative-phase trajectories. -->
  <path d="M86 270C116 248 139 220 163 202C186 187 216 190 246 190H364" class="strong"/>
  <path d="M461 286L486 250L512 216C532 196 554 190 579 188C607 186 630 177 646 151L670 122M670 122V288L694 252L720 217C731 203 740 196 743 194" class="intermediate"/>
  <path d="M836 289L900 122M900 122V289L964 122M964 122V289L1028 122M1028 122V289L1114 129" class="uncoupled"/>

  <!-- Bottom-row axes and preferred-position bands. -->
  <rect x="202" y="384" width="46" height="184" class="band"/>
  <rect x="577" y="384" width="46" height="184" class="band"/>
  <rect x="952" y="384" width="46" height="184" class="band"/>
  <path d="M78 384V568H372 M453 384V568H747 M828 384V568H1122" class="axis"/>
  <path d="M78 542H372 M453 542H747 M828 542H1122" class="zero"/>
  <text x="32" y="476" transform="rotate(-90 32 476)" text-anchor="middle" class="label">mean relative-phase velocity (rad/s)</text>
  <g class="tick" text-anchor="middle">
    <text x="78" y="590">−π</text><text x="225" y="590">0</text><text x="372" y="590">π</text>
    <text x="453" y="590">−π</text><text x="600" y="590">0</text><text x="747" y="590">π</text>
    <text x="828" y="590">−π</text><text x="975" y="590">0</text><text x="1122" y="590">π</text>
  </g>
  <g class="label" text-anchor="middle">
    <text x="225" y="620">relative-phase position (rad)</text>
    <text x="600" y="620">relative-phase position (rad)</text>
    <text x="975" y="620">relative-phase position (rad)</text>
  </g>

  <!-- Idealized phase-dependent velocity curves. -->
  <path d="M86 410C130 423 167 465 200 525C210 543 221 548 232 540C248 527 266 475 289 438C310 414 334 405 364 402" class="strong"/>
  <g class="strong-dot"><circle cx="86" cy="410" r="3"/><circle cx="150" cy="442" r="3"/><circle cx="210" cy="542" r="3"/><circle cx="276" cy="458" r="3"/><circle cx="364" cy="402" r="3"/></g>
  <path d="M461 420C505 426 543 448 573 480C590 498 603 503 618 496C641 484 661 450 686 432C706 418 726 414 739 414" class="intermediate"/>
  <g class="intermediate-dot"><circle cx="461" cy="420" r="3"/><circle cx="535" cy="443" r="3"/><circle cx="603" cy="501" r="3"/><circle cx="675" cy="440" r="3"/><circle cx="739" cy="414" r="3"/></g>
  <path d="M836 432C900 430 968 431 1034 428C1060 427 1084 429 1114 427" class="uncoupled"/>
  <g class="uncoupled-dot"><circle cx="836" cy="432" r="3"/><circle cx="910" cy="430" r="3"/><circle cx="975" cy="431" r="3"/><circle cx="1045" cy="428" r="3"/><circle cx="1114" cy="427" r="3"/></g>
</svg>
