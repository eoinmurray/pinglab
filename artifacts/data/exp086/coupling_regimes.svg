<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative transition from phase locking to intermittent attraction and free drift</title>
  <desc id="desc">Three columns compare strong, intermediate, and zero coupling. Top plots show relative-phase position over time. Bottom plots show relative-phase velocity against position. Strong coupling stops phase motion, intermediate coupling slows but does not stop it near a preferred phase, and zero coupling gives steady drift.</desc>
  <rect width="1200" height="620" fill="#ffffff"/>
  <style>
    .title { font: 600 25px system-ui, sans-serif; fill: #171717; }
    .subtitle { font: 17px system-ui, sans-serif; fill: #555; }
    .head { font: 600 20px system-ui, sans-serif; fill: #171717; }
    .label { font: 16px system-ui, sans-serif; fill: #333; }
    .small { font: 15px system-ui, sans-serif; fill: #555; }
    .axis { stroke: #333; stroke-width: 1.5; fill: none; }
    .guide { stroke: #aeb4bb; stroke-width: 1.2; stroke-dasharray: 5 5; fill: none; }
    .phase { stroke: #171717; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .velocity { stroke: #c51632; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .accent { fill: #dcecf7; }
    .accent-line { stroke: #277da1; stroke-width: 1.5; stroke-dasharray: 5 4; }
  </style>

  <text x="60" y="42" class="title">What weakening coupling should change</text>
  <text x="60" y="70" class="subtitle">Design schematic — these curves are not simulated results</text>

  <text x="220" y="111" text-anchor="middle" class="head">Strong coupling</text>
  <text x="600" y="111" text-anchor="middle" class="head">Intermediate coupling</text>
  <text x="980" y="111" text-anchor="middle" class="head">No coupling</text>

  <!-- preferred-position bands -->
  <rect x="80" y="187" width="280" height="30" rx="3" class="accent"/>
  <rect x="460" y="187" width="280" height="30" rx="3" class="accent"/>
  <rect x="840" y="187" width="280" height="30" rx="3" class="accent"/>

  <!-- top axes -->
  <path d="M80 135 V290 H360 M460 135 V290 H740 M840 135 V290 H1120" class="axis"/>
  <text x="45" y="215" transform="rotate(-90 45 215)" text-anchor="middle" class="label">relative-phase position θ</text>
  <text x="220" y="315" text-anchor="middle" class="label">time</text>
  <text x="600" y="315" text-anchor="middle" class="label">time</text>
  <text x="980" y="315" text-anchor="middle" class="label">time</text>
  <text x="68" y="145" text-anchor="end" class="small">+π</text>
  <text x="68" y="289" text-anchor="end" class="small">−π</text>

  <!-- top trajectories -->
  <path d="M88 250 C115 232 137 215 158 205 C181 197 210 201 238 201 H350" class="phase"/>
  <path d="M468 278 L492 250 L515 222 C532 208 552 202 575 200 C600 198 620 194 634 178 L664 136 M664 136 L664 282 M664 282 L685 252 L708 222 C724 209 733 205 737 204" class="phase"/>
  <path d="M848 280 L915 136 M915 136 L915 282 M915 282 L982 136 M982 136 L982 282 M982 282 L1049 136 M1049 136 L1049 282 M1049 282 L1115 140" class="phase"/>

  <text x="220" y="342" text-anchor="middle" class="small">position settles and stays fixed</text>
  <text x="600" y="342" text-anchor="middle" class="small">position slips, but lingers in blue band</text>
  <text x="980" y="342" text-anchor="middle" class="small">position circulates at nearly steady speed</text>

  <!-- bottom axes -->
  <path d="M80 385 V545 H360 M460 385 V545 H740 M840 385 V545 H1120" class="axis"/>
  <path d="M80 495 H360 M460 495 H740 M840 495 H1120" class="guide"/>
  <text x="43" y="465" transform="rotate(-90 43 465)" text-anchor="middle" class="label">relative-phase velocity vθ</text>
  <text x="220" y="582" text-anchor="middle" class="label">relative-phase position θ</text>
  <text x="600" y="582" text-anchor="middle" class="label">relative-phase position θ</text>
  <text x="980" y="582" text-anchor="middle" class="label">relative-phase position θ</text>
  <text x="68" y="500" text-anchor="end" class="small">0</text>
  <text x="82" y="565" class="small">−π</text>
  <text x="350" y="565" text-anchor="end" class="small">+π</text>
  <text x="462" y="565" class="small">−π</text>
  <text x="730" y="565" text-anchor="end" class="small">+π</text>
  <text x="842" y="565" class="small">−π</text>
  <text x="1110" y="565" text-anchor="end" class="small">+π</text>

  <!-- bottom velocity curves -->
  <path d="M88 405 C130 420 166 457 198 491 C205 498 213 502 222 500 C238 496 255 472 273 444 C292 418 317 405 350 401" class="velocity"/>
  <circle cx="211" cy="498" r="6" fill="#277da1"/>
  <path d="M468 413 C510 418 545 434 573 455 C589 467 600 472 613 469 C634 464 652 441 673 426 C692 413 713 408 732 407" class="velocity"/>
  <path d="M848 421 C912 419 979 420 1045 418 C1070 417 1090 418 1112 417" class="velocity"/>

  <text x="220" y="375" text-anchor="middle" class="small">correction cancels detuning: vθ = 0</text>
  <text x="600" y="375" text-anchor="middle" class="small">correction lowers vθ but does not reach zero</text>
  <text x="980" y="375" text-anchor="middle" class="small">detuning remains: vθ is nearly constant</text>
</svg>
