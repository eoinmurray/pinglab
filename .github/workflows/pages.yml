name: Deploy locally built site to GitHub Pages

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PINGLAB_R2_DESTINATION: r2:pinglab/pingstore/runs

jobs:
  build:
    if: github.ref == 'refs/heads/gh-pages'
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out publication tools
        uses: actions/checkout@v5
        with:
          ref: main
          path: source
      - name: Check out the prebuilt site
        uses: actions/checkout@v5
        with:
          path: published
      - name: Exclude repository metadata from the site artifact
        run: rm -rf published/.git published/.github
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install publication metadata dependencies
        run: |
          python -m pip install PyYAML==6.0.3 boto3==1.43.119
          sudo apt-get update -qq
          sudo apt-get install --yes rclone
      - name: Configure publication coordination
        env:
          PINGLAB_RCLONE_CONFIG: ${{ secrets.PINGLAB_RCLONE_CONFIG }}
        run: |
          test -n "$PINGLAB_RCLONE_CONFIG" || { echo 'Publication coordination requires PINGLAB_RCLONE_CONFIG.'; exit 1; }
          config="$RUNNER_TEMP/pinglab-rclone.conf"
          umask 077
          printf '%s' "$PINGLAB_RCLONE_CONFIG" > "$config"
          echo "RCLONE_CONFIG=$config" >> "$GITHUB_ENV"
      - name: Stamp and retain the prebuilt evidence
        env:
          PYTHONPATH: source/libraries
        run: |
          python - <<'PYCODE'
          import json
          import os
          from pathlib import Path
          from pingstore.core import publication_retain, validate_evidence_manifest
          path = Path('published/pingstore-evidence.json')
          manifest = json.loads(path.read_text())
          validate_evidence_manifest(manifest)
          if manifest.get('publication_mode') != 'bundled' or manifest.get('source') != 'local':
              raise SystemExit('Only a self-contained local build may be deployed.')
          if not Path('published/index.html').is_file():
              raise SystemExit('The prebuilt site has no index.html.')
          manifest['build'].update(id=f"{os.environ['GITHUB_RUN_ID']}/{os.environ['GITHUB_RUN_ATTEMPT']}",
                                   revision=os.environ['GITHUB_SHA'])
          publication_retain(os.environ['PINGLAB_R2_DESTINATION'], manifest)
          path.write_text(json.dumps(manifest, indent=2) + '\n')
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: pingstore-evidence
          path: published/pingstore-evidence.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: published
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      deployments: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install publication dependencies
        run: |
          python -m pip install PyYAML==6.0.3 boto3==1.43.119
          sudo apt-get update -qq
          sudo apt-get install --yes rclone
      - name: Configure authenticated evidence storage
        env:
          PINGLAB_RCLONE_CONFIG: ${{ secrets.PINGLAB_RCLONE_CONFIG }}
        run: |
          test -n "$PINGLAB_RCLONE_CONFIG"
          config="$RUNNER_TEMP/pinglab-rclone.conf"
          umask 077
          printf '%s' "$PINGLAB_RCLONE_CONFIG" > "$config"
          echo "RCLONE_CONFIG=$config" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: pingstore-evidence
          path: evidence
      - name: Retain frozen evidence before deployment or retry
        env:
          PYTHONPATH: libraries
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from pingstore.core import load_json, publication_retain
          manifest = load_json(Path('evidence/pingstore-evidence.json'))
          assert manifest['build']['id'].split('/')[0] == os.environ['GITHUB_RUN_ID']
          assert manifest['build']['revision'] == os.environ['GITHUB_SHA']
          publication_retain(os.environ['PINGLAB_R2_DESTINATION'], manifest)
          PY
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Preserve incoming evidence after an uncertain deployment
        if: failure()
        run: echo 'Deployment did not finish; incoming evidence remains protected until a verified replacement succeeds.'
  activate:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      deployments: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install publication dependencies
        run: |
          python -m pip install PyYAML==6.0.3 boto3==1.43.119
          sudo apt-get update -qq
          sudo apt-get install --yes rclone
      - name: Configure authenticated evidence storage
        env:
          PINGLAB_RCLONE_CONFIG: ${{ secrets.PINGLAB_RCLONE_CONFIG }}
        run: |
          test -n "$PINGLAB_RCLONE_CONFIG"
          config="$RUNNER_TEMP/pinglab-rclone.conf"
          umask 077
          printf '%s' "$PINGLAB_RCLONE_CONFIG" > "$config"
          echo "RCLONE_CONFIG=$config" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: pingstore-evidence
          path: evidence
      - name: Confirm active deployed evidence
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: libraries
        run: |
          python - <<'PY'
          import os
          import time
          from pathlib import Path
          from pingstore.core import PingstoreError, load_json, publication_activate
          manifest = load_json(Path('evidence/pingstore-evidence.json'))
          for attempt in range(24):
              try:
                  publication_activate(Path('.'), os.environ['PINGLAB_R2_DESTINATION'], manifest)
                  break
              except PingstoreError:
                  if attempt == 23:
                      raise
                  time.sleep(10)
          PY
