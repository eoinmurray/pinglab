name: Quality checks

on:
  push:
    branches: [main]
  schedule:
    # Nightly full suite. GitHub Actions cron is always UTC.
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Coalesce rapid pushes without allowing one to cancel the nightly full run.
  group: quality-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reject new raw publication payloads
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "push" && "$PUSH_BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            base="$PUSH_BASE_SHA"
          else
            base="HEAD^"
          fi

          mapfile -t added < <(git diff --name-only --diff-filter=A "$base" HEAD)
          rejected=()
          for path in "${added[@]}"; do
            case "$path" in
              artifacts/data/*.npy|artifacts/data/*.npz|artifacts/data/*.pt|artifacts/data/*.pth|artifacts/data/*.h5|artifacts/data/*.hdf5)
                rejected+=("$path: raw numerical payload belongs in runs/ and the verified R2 archive")
                ;;
            esac
            if [[ -f "$path" ]]; then
              size=$(wc -c < "$path")
              if (( size > 5242880 )); then
                rejected+=("$path: new tracked file exceeds 5 MiB; archive it or justify a narrower policy exception")
              fi
            fi
          done

          if (( ${#rejected[@]} )); then
            printf '%s\n' "New files violate the compact scientific-artifact policy:" "${rejected[@]}"
            exit 1
          fi

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install rendering system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libcairo2-dev libpango1.0-dev pkg-config

      - name: Install project
        run: uv sync --dev

      - name: Ruff
        run: uv run ruff check --output-format=github

      - name: Experiment tool-import boundary
        run: uv run ruff check experiments --select TID --output-format=github

      - name: Fast test suite
        if: github.event_name == 'push'
        run: >-
          uv run pytest -q -m "not slow"
          tools/snnsim/tests

      - name: Full test suite
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: >-
          uv run pytest -q
          tools/snnsim/tests
