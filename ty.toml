# ty type-checker configuration for pinglab.
# Python includes Pingstore and experiment runners; the SNN library is external.

[environment]
python-version = "3.10"
# Pinglab source roots; snnlab is resolved from the installed dependency.
root = ["experiments", "."]

[src]
exclude = [
    ".venv",
    # Engine staging (machine-managed) + generated output — not our
    # type-checked surface.
    ".demolab",
    "artifacts",
    "temp",
]

[terminal]
output-format = "concise"
