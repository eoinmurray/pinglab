[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pinglab-pingstore"
version = "0.1.0"
description = "Small run folders, metadata-only reads and incremental rclone backups"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
pingstore = "pingstore.cli:main"

[tool.setuptools]
packages = ["pingstore"]
package-dir = { pingstore = "." }
