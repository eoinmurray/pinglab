# Experiment configuration: consume the installed snnlab library rather than
# importing Pinglab tool implementations or bare simulator modules.
extend = "../ruff.toml"

[lint]
extend-select = ["TID"]

[lint.flake8-tidy-imports.banned-api]
"tools".msg = "use installed snnlab APIs or its module CLI instead of Pinglab tool implementations"
"models".msg = "use snnlab.sim APIs or python -m snnlab.sim, not a bare models import"
